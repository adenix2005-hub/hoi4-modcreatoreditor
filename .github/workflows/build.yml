name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build .exe
        run: npx electron-builder --win portable nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: HOI4-Mod-Studio-Windows
          path: |
            dist/HOI4-Mod-Studio-portable.exe
            dist/HOI4-Mod-Studio-Setup.exe

      - name: Publish download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('HOI4 Mod Studio build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            Windows build of HOI4 Mod Studio (from `${{ github.ref_name }}`).
            - **HOI4-Mod-Studio-portable.exe** — just double-click it, no install.
            - **HOI4-Mod-Studio-Setup.exe** — normal installer with a Start menu shortcut.

            Windows may show "Windows protected your PC" because the app isn't code-signed: click **More info → Run anyway**.
          files: |
            dist/HOI4-Mod-Studio-portable.exe
            dist/HOI4-Mod-Studio-Setup.exe
